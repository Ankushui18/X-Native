[package]
name = "x-designer"
version = "0.34.0"
edition = "2021"
[[bin]]
name = "x_native_app"
path = "src/bin/x_native_app/main.rs"
[[bin]]
name = "render_headless"
path = "src/bin/render_headless.rs"
[[bin]]
name = "arco_native"
path = "src/bin/arco_native.rs"
[[bin]]
name = "type_proof"
path = "src/bin/type_proof.rs"

[dependencies]
arco_native = { path = "../../crates/x-native", package = "arco_native" }
vello = "0.1"
wgpu = "0.19"
winit = { version = "0.29", features = ["rwh_06"] }
pollster = "1.0.1"
png = "0.18.1"
rfd = "0.14"
[[bin]]
name = "export_regression"
path = "src/bin/export_regression.rs"
[[bin]]
name = "bench_scale"
path = "src/bin/bench_scale.rs"

[[bin]]
name = "mklib"
path = "src/bin/mklib.rs"
